<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>เงินรุ่น — แจ้งชำระเงิน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* Theme: navy from itm69-class-fund + soft gold accent */
    :root {
      --bg: #0b1733;
      --cream: #f3efda;
      --gold: #e8c36a;
      --ink: var(--cream);
      --muted: #b8c2d6;
      --card: #132445;
      --card-2: #172b50;
      --accent: var(--gold);
      --accent-ink: #0b1733;
      --danger: #ff8f7a;
      --warn: #f6d27d;
      --ok: #e8c36a;
      --line: #ffffff26;
      --focus: #e4a75b;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(ellipse at 80% 10%, #24478266, transparent 55%),
        radial-gradient(ellipse at 10% 90%, #163c3044, transparent 50%),
        var(--bg);
    }
    *, *::before, *::after { box-sizing: border-box; }
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 1rem 1rem 2rem;
      overflow-x: hidden;
    }
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
    }
    .panel {
      background: linear-gradient(160deg, #16284aee, #11203ccc);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1rem;
      backdrop-filter: blur(8px);
      overflow-x: hidden;
      min-width: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3rem;
      border-radius: 999px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--accent-ink);
    }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-ghost {
      background: #0b173366;
      color: var(--cream);
      border: 1px solid #f3efda66;
    }
    .input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid #ffffff55;
      border-radius: 0.75rem;
      padding: 0.75rem 0.85rem;
      background: var(--card-2);
      color: var(--cream);
      outline: none;
      font-size: 16px; /* avoid iOS zoom + native control overflow */
    }
    .input::placeholder { color: #8999b6; }
    .input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #e8c36a33;
    }
    .input:disabled { opacity: 0.65; }
    input[type="datetime-local"],
    input[type="number"],
    input[type="file"] {
      color-scheme: dark;
      max-width: 100%;
      min-width: 0;
    }
    /* Native datetime-local has a large intrinsic min-width on mobile */
    input[type="datetime-local"] {
      width: 100%;
      max-width: 100%;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="file"] {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field {
      min-width: 0;
      max-width: 100%;
    }
    .label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pending { background: #f6d27d22; color: var(--warn); border: 1px solid #f6d27d55; }
    .badge-approved { background: #e8c36a22; color: var(--ok); border: 1px solid #e8c36a55; }
    .badge-rejected { background: #ff8f7a22; color: var(--danger); border: 1px solid #ff8f7a55; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      background: var(--cream);
      color: #163c30;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 50;
      max-width: calc(100% - 2rem);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
    .spinner {
      width: 2rem; height: 2rem;
      border: 3px solid #8999b6;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .progress-track {
      position: relative;
      height: 0.65rem;
      border-radius: 999px;
      background: #0b1733;
      border: 1px solid var(--line);
      overflow: visible;
      margin-top: 0.75rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c9a84a, var(--gold));
      transition: width .35s ease, background .35s ease;
    }
    .progress-fill.is-on-track {
      background: linear-gradient(90deg, #1f7a4d, #3dbe7a);
    }
    .progress-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 2px;
      background: var(--cream);
      border-radius: 2px;
      box-shadow: 0 0 0 2px #0b173388;
      transform: translateX(-50%);
      left: 0%;
      transition: left .35s ease;
    }
    .progress-marker:after {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid var(--cream);
    }
    /* Primary receive-account bank row (บัญชีรับโอน only) */
    .bank-name-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.35rem;
    }
    .bank-logo {
      width: 3rem;
      height: 3rem;
      flex-shrink: 0;
      border-radius: 0.55rem;
      object-fit: cover;
      box-shadow: 0 0 0 1px #ffffff22;
    }
    .bank-name-text {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--cream);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="mb-4">
      <p class="eyebrow">ITM69 · Class Fund</p>
      <h1 class="text-2xl font-bold tracking-tight mt-1">โอน & ส่งสลิป</h1>
      <p class="text-sm mt-1" style="color:var(--muted)">ร่วมกันเก็บ · ร่วมกันใช้ · ร่วมกันตรวจสอบ</p>
    </header>

    <section id="view-loading" class="panel flex flex-col items-center gap-3 py-10">
      <div class="spinner"></div>
      <p style="color:var(--muted)">กำลังตรวจสอบตัวตน…</p>
    </section>

    <section id="view-error" class="panel hidden">
      <h2 class="font-semibold text-lg mb-2">เกิดข้อผิดพลาด</h2>
      <p id="error-text" class="mb-4" style="color:var(--danger)"></p>
      <button class="btn btn-primary" type="button" onclick="boot()">ลองใหม่</button>
    </section>

    <section id="view-bind" class="hidden space-y-3">
      <div class="panel flex items-center gap-3">
        <img id="bind-avatar" alt="" class="w-12 h-12 rounded-full object-cover" style="background:#244782" />
        <div>
          <p class="font-semibold" id="bind-display-name">LINE user</p>
          <p class="text-sm" style="color:var(--muted)">ลงทะเบียนยืนยันตัวตนครั้งแรก</p>
        </div>
      </div>
      <div class="panel space-y-3">
        <div>
          <label class="label" for="member-id-input">รหัสนักศึกษา</label>
          <input id="member-id-input" class="input" type="text" inputmode="text" autocomplete="off" placeholder="กรอกรหัสนักศึกษาของตนเอง" />
        </div>
        <button id="btn-lookup" class="btn btn-ghost" type="button">ตรวจสอบรหัส</button>
        <div id="bind-confirm" class="hidden rounded-xl border p-3 space-y-1" style="border-color:var(--line)">
          <p class="text-sm" style="color:var(--muted)">ยืนยันว่าเป็นคุณ</p>
          <p class="font-semibold" id="bind-confirm-name">—</p>
          <p class="text-sm" id="bind-confirm-id" style="color:var(--muted)">—</p>
        </div>
        <button id="btn-bind" class="btn btn-primary" type="button" disabled>ยืนยันการผูกบัญชี</button>
      </div>
    </section>

    <section id="view-home" class="hidden space-y-3">
      <div class="panel">
        <p class="text-sm" style="color:var(--muted)">สมาชิกที่ผูกไว้</p>
        <p class="text-lg font-semibold" id="home-name">—</p>
        <p class="text-sm" id="home-id" style="color:var(--muted)">—</p>
        <p class="mt-2 text-sm">ยอดอนุมัติสะสม
          <span class="font-semibold" id="home-total" style="color:var(--gold)">0.00</span> บาท
        </p>
        <div id="plan-progress" class="hidden">
          <div class="progress-track" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
            <div id="progress-marker" class="progress-marker"></div>
          </div>
          <p id="progress-line" class="text-sm mt-2" style="color:var(--muted)"></p>
          <p id="progress-status" class="text-sm font-semibold mt-1" style="color:var(--gold)"></p>
        </div>
      </div>

      <div class="panel space-y-2">
        <p class="font-semibold">บัญชีรับโอน</p>
        <div id="bank-lines" class="text-sm leading-relaxed" style="color:var(--muted)">—</div>
        <button class="btn btn-ghost" type="button" id="btn-copy-account">คัดลอกเลขบัญชี</button>
      </div>

      <div class="flex gap-2">
        <button class="btn btn-primary" type="button" id="tab-pay">แจ้งโอน</button>
        <button class="btn btn-ghost" type="button" id="tab-history">ประวัติ</button>
      </div>

      <div id="pane-pay" class="panel space-y-3">
        <div>
          <label class="label" for="amount">ยอดเงินที่โอน (บาท)</label>
          <input id="amount" class="input" type="number" min="0.01" step="0.01" inputmode="decimal" required />
        </div>
        <div class="field">
          <label class="label" for="transfer-dt">วันและเวลาที่โอน</label>
          <input id="transfer-dt" class="input" type="datetime-local" required />
        </div>
        <div>
          <label class="label" for="slip">แนบรูปสลิป</label>
          <input id="slip" class="input" type="file" accept="image/*" required />
          <img id="slip-preview" alt="preview" class="mt-2 max-h-48 rounded-lg hidden w-full object-contain" style="background:#0b1733;border:1px solid var(--line)" />
        </div>
        <div>
          <label class="label" for="note">หมายเหตุ (ไม่บังคับ)</label>
          <input id="note" class="input" type="text" maxlength="200" />
        </div>
        <button id="btn-submit" class="btn btn-primary" type="button">ส่งรายการ</button>
      </div>

      <div id="pane-history" class="panel hidden space-y-3">
        <p class="font-semibold">ประวัติของฉัน</p>
        <div id="history-list" class="space-y-2"></div>
        <button class="btn btn-ghost" type="button" id="btn-refresh-history">รีเฟรช</button>
      </div>
    </section>

    <section id="view-success" class="panel hidden text-center space-y-3 py-8">
      <p class="text-lg font-semibold" style="color:var(--ok)">ส่งรายการสำเร็จ</p>
      <p id="success-text" class="text-sm" style="color:var(--muted)"></p>
      <button class="btn btn-primary" type="button" id="btn-success-home">กลับหน้าหลัก</button>
      <button class="btn btn-ghost" type="button" id="btn-close">ปิดหน้าต่าง</button>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /**
     * Per-cohort deploy config.
     * Host UI on GitHub Pages (repo root index.html).
     * gasUrl = Apps Script Web App /exec URL (API only; not for hosting HTML).
     * After edit: git push, wait for Pages, set LIFF Endpoint to the Pages URL.
     */
    const APP_CONFIG = {
      liffId: '2012729702-WhzRWaKF',
      gasUrl: 'https://script.google.com/macros/s/AKfycbwaLjilXtl4p1INKSdqxcpK5vSRSBbboLzCgxcwaQiF4yjprhALDHE3Xx43WBRiUSSizQ/exec'
    };

    const state = {
      mock: false,
      mockPassword: '',
      profile: null,
      selectedMemberId: null,
      lookupMember: null,
      member: null,
      bank: null,
      plan: null,
      compressedSlip: null
    };

    function $(id) { return document.getElementById(id); }

    function showView(id) {
      ['loading', 'error', 'bind', 'home', 'success'].forEach(function (name) {
        $('view-' + name).classList.toggle('hidden', name !== id);
      });
    }

    function toast(msg) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    function qs() {
      return new URLSearchParams(location.search);
    }

    function formatMoney(n) {
      return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function defaultDatetimeLocal() {
      var d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    function isIdTokenExpiredMessage(msg) {
      var s = String(msg || '');
      return /IdToken expired/i.test(s) || /id token expired/i.test(s);
    }

    /** Decode JWT payload without verifying signature (expiry check only). */
    function isIdTokenFresh(token) {
      if (!token) return false;
      try {
        var parts = token.split('.');
        if (parts.length < 2) return false;
        var json = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (json.length % 4) json += '=';
        var payload = JSON.parse(atob(json));
        if (!payload.exp) return false;
        return payload.exp * 1000 > Date.now() + 15000;
      } catch (e) {
        return false;
      }
    }

    function reLoginForFreshIdToken() {
      if (state.mock) return;
      try {
        if (liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (e) { /* ignore */ }
      liff.login();
    }

    async function boot() {
      showView('loading');
      try {
        var params = qs();
        state.mock = params.get('mock') === '1';

        /* Local/UI preview of บัญชีรับโอน (no LIFF). */
        if (params.get('previewBank') === '1') {
          state.member = {
            member_id: '6900001',
            full_name: 'ตัวอย่าง สมาชิก',
            nickname: 'ตัวอย่าง',
            total_paid: 900
          };
          state.bank = {
            bank_name: 'ธนาคารไทยพาณิชย์',
            account_name: 'ชื่อบัญชีกองทุนรุ่น',
            account_no: '000-0-00000-0'
          };
          state.plan = null;
          renderHome();
          showView('home');
          return;
        }

        if (state.mock) {
          state.mockPassword = params.get('pw') || window.prompt('รหัส mock (MOCK_PASSWORD)') || '';
          state.profile = {
            userId: params.get('uid') || 'mock-user-001',
            displayName: params.get('name') || 'Mock User',
            pictureUrl: ''
          };
        } else {
          if (!APP_CONFIG.liffId || APP_CONFIG.liffId === 'YOUR_LIFF_ID') {
            throw new Error('ยังไม่ได้ตั้ง LIFF ID ใน APP_CONFIG');
          }
          await liff.init({ liffId: APP_CONFIG.liffId });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          if (!isIdTokenFresh(liff.getIDToken())) {
            reLoginForFreshIdToken();
            return;
          }
          state.profile = await liff.getProfile();
        }

        if (!APP_CONFIG.gasUrl || APP_CONFIG.gasUrl === 'YOUR_GAS_WEB_APP_URL') {
          throw new Error('ยังไม่ได้ตั้ง GAS Web App URL ใน APP_CONFIG');
        }

        await refreshUser();
      } catch (err) {
        if (!state.mock && isIdTokenExpiredMessage(err.message)) {
          reLoginForFreshIdToken();
          return;
        }
        $('error-text').textContent = err.message || String(err);
        showView('error');
      }
    }

    async function api(action, payload) {
      var body = Object.assign({ action: action }, payload || {});
      if (state.mock) {
        body.mock = true;
        body.mock_password = state.mockPassword;
        body.line_user_id = state.profile.userId;
      } else {
        var token = liff.getIDToken();
        if (!isIdTokenFresh(token)) {
          reLoginForFreshIdToken();
          throw new Error('เซสชันหมดอายุ — กำลังเข้าสู่ระบบใหม่…');
        }
        body.id_token = token;
        body.line_user_id = state.profile.userId;
        if (!body.id_token) {
          throw new Error('ไม่ได้รับ LINE ID token — ตรวจ LIFF scope openid');
        }
      }

      var res = await fetch(APP_CONFIG.gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      var data = await res.json();
      if (data.status === 'error') {
        if (!state.mock && isIdTokenExpiredMessage(data.message)) {
          reLoginForFreshIdToken();
          throw new Error('เซสชันหมดอายุ — กำลังเข้าสู่ระบบใหม่…');
        }
        throw new Error(data.message || 'API error');
      }
      return data;
    }

    async function refreshUser() {
      var data = await api('checkUser', {});
      state.bank = data.bank || null;
      state.plan = data.plan || null;
      if (data.status === 'bound') {
        state.member = data.member;
        renderHome();
        showView('home');
      } else {
        renderBind();
        showView('bind');
      }
    }

    function clearBindLookup() {
      state.selectedMemberId = null;
      state.lookupMember = null;
      $('btn-bind').disabled = true;
      $('bind-confirm').classList.add('hidden');
    }

    function renderBind() {
      $('bind-display-name').textContent = state.profile.displayName;
      if (state.profile.pictureUrl) {
        $('bind-avatar').src = state.profile.pictureUrl;
      }
      $('member-id-input').value = '';
      clearBindLookup();

      $('member-id-input').oninput = function () {
        clearBindLookup();
      };

      $('btn-lookup').onclick = async function () {
        var memberId = $('member-id-input').value.trim();
        if (!memberId) {
          toast('กรอกรหัสนักศึกษาก่อน');
          return;
        }
        var btn = $('btn-lookup');
        var input = $('member-id-input');
        var oldLabel = btn.textContent;
        btn.disabled = true;
        input.disabled = true;
        $('btn-bind').disabled = true;
        btn.textContent = 'กำลังตรวจสอบ…';
        try {
          var data = await api('lookupMember', { member_id: memberId });
          state.lookupMember = data.member;
          state.selectedMemberId = data.member.member_id;
          $('bind-confirm-name').textContent =
            data.member.full_name + (data.member.nickname ? ' (' + data.member.nickname + ')' : '');
          $('bind-confirm-id').textContent = 'รหัส ' + data.member.member_id;
          $('bind-confirm').classList.remove('hidden');
          $('btn-bind').disabled = false;
        } catch (err) {
          clearBindLookup();
          toast(err.message || String(err));
        } finally {
          btn.disabled = false;
          input.disabled = false;
          btn.textContent = oldLabel;
        }
      };

      $('btn-bind').onclick = async function () {
        if (!state.selectedMemberId) return;
        var btn = $('btn-bind');
        var oldLabel = btn.textContent;
        btn.disabled = true;
        $('btn-lookup').disabled = true;
        $('member-id-input').disabled = true;
        btn.textContent = 'กำลังผูกบัญชี…';
        try {
          var data = await api('bindUser', {
            member_id: state.selectedMemberId,
            line_display_name: state.profile.displayName
          });
          state.member = data.member;
          state.bank = data.bank || state.bank;
          state.plan = data.plan || state.plan;
          toast('ผูกบัญชีสำเร็จ');
          renderHome();
          showView('home');
        } catch (err) {
          toast(err.message || String(err));
          btn.disabled = false;
          $('btn-lookup').disabled = false;
          $('member-id-input').disabled = false;
          btn.textContent = oldLabel;
        }
      };
    }

    function renderHome() {
      $('home-name').textContent = state.member.full_name + (state.member.nickname ? ' (' + state.member.nickname + ')' : '');
      $('home-id').textContent = 'รหัส ' + state.member.member_id;
      $('home-total').textContent = formatMoney(state.member.total_paid);
      renderPlanProgress(state.plan, state.member.total_paid);
      renderBank();
      $('transfer-dt').value = defaultDatetimeLocal();
      showPayPane();
    }

    function renderPlanProgress(plan, totalPaid) {
      var box = $('plan-progress');
      var fill = $('progress-fill');
      if (!plan || !(Number(plan.plan_total) > 0) || !(Number(plan.month_index) > 0)) {
        fill.classList.remove('is-on-track');
        box.classList.add('hidden');
        return;
      }
      var paid = Number(totalPaid || 0);
      var planTotal = Number(plan.plan_total);
      var expected = Number(plan.expected_to_date || 0);
      var pct = Math.max(0, Math.min(100, (paid / planTotal) * 100));
      var markerPct = Math.max(0, Math.min(100, (expected / planTotal) * 100));
      var over = paid - planTotal;
      var arrears = Math.max(0, expected - paid);
      var status = '';
      if (paid >= planTotal) {
        status = over > 0.009
          ? 'ครบแผนแล้ว · เกิน ' + formatMoney(over) + ' บาท'
          : 'ครบแผนแล้ว';
      } else if (paid >= expected) {
        status = 'ตามเป้าเดือนนี้แล้ว (เดือนที่ ' + plan.month_index + '/' + plan.plan_months + ')';
      } else {
        status = 'ค้างอีก ' + formatMoney(arrears) + ' บาท ถึงเป้าเดือนนี้';
      }

      fill.style.width = pct.toFixed(1) + '%';
      fill.classList.toggle('is-on-track', paid >= expected);
      $('progress-marker').style.left = markerPct.toFixed(1) + '%';
      $('progress-line').textContent =
        formatMoney(paid) + ' / ' + formatMoney(planTotal) + ' บาท · '
        + pct.toFixed(0) + '%'
        + ' · เป้าเดือนนี้ ' + formatMoney(expected) + ' บาท';
      $('progress-status').textContent = status;
      box.classList.remove('hidden');
    }

    function renderBank() {
      var b = state.bank || {};
      var bankName = escapeHtml(b.bank_name || '—');
      var accountName = escapeHtml(b.account_name || '—');
      var accountNo = escapeHtml(b.account_no || '—');
      $('bank-lines').innerHTML =
        '<div class="bank-name-row">' +
          '<img class="bank-logo" src="assets/scb-logo.png" width="48" height="48" alt="SCB" />' +
          '<span class="bank-name-text">' + bankName + '</span>' +
        '</div>' +
        accountName + '<br/>' +
        '<span class="font-semibold" style="color:var(--gold)">' + accountNo + '</span>';
    }

    function showPayPane() {
      $('pane-pay').classList.remove('hidden');
      $('pane-history').classList.add('hidden');
      $('tab-pay').classList.remove('btn-ghost');
      $('tab-pay').classList.add('btn-primary');
      $('tab-history').classList.add('btn-ghost');
      $('tab-history').classList.remove('btn-primary');
    }

    function showHistoryPane() {
      $('pane-pay').classList.add('hidden');
      $('pane-history').classList.remove('hidden');
      $('tab-history').classList.remove('btn-ghost');
      $('tab-history').classList.add('btn-primary');
      $('tab-pay').classList.add('btn-ghost');
      $('tab-pay').classList.remove('btn-primary');
      loadHistory();
    }

    $('tab-pay').onclick = showPayPane;
    $('tab-history').onclick = showHistoryPane;
    $('btn-refresh-history').onclick = loadHistory;

    $('btn-copy-account').onclick = async function () {
      var no = (state.bank && state.bank.account_no) || '';
      if (!no) {
        toast('ยังไม่มีเลขบัญชี');
        return;
      }
      try {
        await navigator.clipboard.writeText(no);
        toast('คัดลอกเลขบัญชีแล้ว');
      } catch (e) {
        toast('คัดลอกไม่สำเร็จ');
      }
    };

    $('slip').onchange = async function (e) {
      var file = e.target.files && e.target.files[0];
      state.compressedSlip = null;
      if (!file) {
        $('slip-preview').classList.add('hidden');
        return;
      }
      try {
        state.compressedSlip = await compressImage(file, 1000, 0.8);
        $('slip-preview').src = state.compressedSlip.dataUrl;
        $('slip-preview').classList.remove('hidden');
      } catch (err) {
        toast(err.message || 'ย่อรูปไม่สำเร็จ');
      }
    };

    function compressImage(file, maxWidth, quality) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var scale = Math.min(1, maxWidth / img.width);
            var w = Math.round(img.width * scale);
            var h = Math.round(img.height * scale);
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({
              dataUrl: dataUrl,
              base64: dataUrl.split(',')[1],
              mime: 'image/jpeg'
            });
          };
          img.onerror = function () { reject(new Error('เปิดรูปไม่สำเร็จ')); };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    $('btn-submit').onclick = async function () {
      var amount = Number($('amount').value);
      var transferDt = $('transfer-dt').value;
      var note = $('note').value.trim();
      if (!(amount > 0)) {
        toast('กรอกยอดเงินให้ถูกต้อง');
        return;
      }
      if (!transferDt) {
        toast('ระบุวันเวลาที่โอน');
        return;
      }
      if (!state.compressedSlip) {
        toast('แนบสลิปก่อนส่ง');
        return;
      }

      var btn = $('btn-submit');
      btn.disabled = true;
      var old = btn.textContent;
      btn.textContent = 'กำลังส่ง…';
      try {
        var data = await api('submitPayment', {
          member_id: state.member.member_id,
          amount: amount,
          transfer_datetime: transferDt,
          note: note,
          file_base64: state.compressedSlip.base64,
          file_mime_type: state.compressedSlip.mime
        });
        $('success-text').textContent =
          'รหัสรายการ ' + data.transaction_id + ' · ยอด ' + formatMoney(amount) + ' บาท · รอเหรัญญิกตรวจสอบ';
        showView('success');
        $('amount').value = '';
        $('note').value = '';
        $('slip').value = '';
        state.compressedSlip = null;
        $('slip-preview').classList.add('hidden');
      } catch (err) {
        toast(err.message || String(err));
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    };

    async function loadHistory() {
      var box = $('history-list');
      box.innerHTML = '<p class="text-sm" style="color:var(--muted)">กำลังโหลด…</p>';
      try {
        var data = await api('getMyTransactions', {});
        if (data.member) {
          state.member = data.member;
          $('home-total').textContent = formatMoney(state.member.total_paid);
        }
        if (data.plan !== undefined) {
          state.plan = data.plan;
        }
        if (state.member) {
          renderPlanProgress(state.plan, state.member.total_paid);
        }
        var list = data.transactions || [];
        if (!list.length) {
          box.innerHTML = '<p class="text-sm" style="color:var(--muted)">ยังไม่มีรายการ</p>';
          return;
        }
        box.innerHTML = '';
        list.forEach(function (tx) {
          var el = document.createElement('div');
          el.className = 'rounded-xl border p-3';
          el.style.borderColor = 'var(--line)';
          var badgeClass = 'badge-pending';
          if (tx.status === 'Approved') badgeClass = 'badge-approved';
          if (tx.status === 'Rejected') badgeClass = 'badge-rejected';
          el.innerHTML =
            '<div class="flex items-center justify-between gap-2">' +
              '<p class="font-semibold">' + formatMoney(tx.amount) + ' บาท</p>' +
              '<span class="badge ' + badgeClass + '">' + tx.status + '</span>' +
            '</div>' +
            '<p class="text-xs mt-1" style="color:var(--muted)">' + tx.transaction_id + '</p>' +
            '<p class="text-sm mt-1" style="color:var(--muted)">โอน: ' + (tx.transfer_datetime || '—') + '</p>' +
            (tx.status === 'Rejected' && tx.reject_reason
              ? '<p class="text-sm mt-1" style="color:var(--danger)">เหตุผล: ' + escapeHtml(tx.reject_reason) + '</p>'
              : '');
          box.appendChild(el);
        });
      } catch (err) {
        box.innerHTML = '<p class="text-sm" style="color:var(--danger)">' + escapeHtml(err.message || String(err)) + '</p>';
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    $('btn-success-home').onclick = async function () {
      showView('loading');
      try {
        await refreshUser();
      } catch (err) {
        $('error-text').textContent = err.message || String(err);
        showView('error');
      }
    };

    $('btn-close').onclick = function () {
      if (!state.mock && typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
        liff.closeWindow();
      } else {
        toast('ปิดแท็บนี้ได้เลย');
      }
    };

    boot();
  </script>
</body>
</html>
